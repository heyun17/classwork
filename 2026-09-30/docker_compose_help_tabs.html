<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docker Compose --help 명령어/옵션 정리</title>
<style>
:root {

  --line:#dbe2ea; --accent:#2457d6; --accent-soft:#eaf0ff;

}
* { box-sizing:border-box; }
body {
  margin:0; font-family:system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif;

}
header {
  background:var(--card); border-bottom:1px solid var(--line);
  padding:28px 24px 18px; position:sticky; top:0; z-index:20;
}
.wrap { max-width:1200px; margin:0 auto; }
h1 { margin:0 0 8px; font-size:28px; }
.subtitle { color:var(--muted); font-size:14px; }
.toolbar { display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
#search {
  flex:1; min-width:240px; padding:10px 12px; border:1px solid var(--line);
  border-radius:10px; font-size:14px; background:white;
}
.filter-btn {
  border:1px solid var(--line); background:white; padding:9px 12px;
  border-radius:10px; cursor:pointer;
}
.filter-btn.active { border-color:var(--accent); background:var(--accent-soft); color:var(--accent); }
.tabs-wrap {
  background:var(--card); border-bottom:1px solid var(--line);
  position:sticky; top:142px; z-index:19;
}
.tabs {
  max-width:1200px; margin:0 auto; display:flex; gap:6px; overflow-x:auto;
  padding:10px 16px; scrollbar-width:thin;
}
.tab {
  white-space:nowrap; border:1px solid var(--line); background:#fff; color:#334155;
  border-radius:999px; padding:8px 12px; cursor:pointer; font-size:13px;
}
.tab:hover { border-color:#9fb2dd; }
.tab.active { background:var(--accent); color:white; border-color:var(--accent); }
.tab .star { margin-left:5px; font-size:10px; }
main { padding:24px 16px 60px; }
.card {
  max-width:1200px; margin:0 auto; background:var(--card); border:1px solid var(--line);
  border-radius:16px; padding:24px; box-shadow:0 2px 10px rgba(15,23,42,.04);
}
.command-title { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.command-title h2 { margin:0; font-size:24px; }
.badge {
  display:inline-flex; border-radius:999px; padding:3px 8px; font-size:11px;
  background:var(--accent-soft); color:var(--accent); font-weight:700;
}
.badge.exp { background:#fff1f2; color:#be123c; }
.desc { margin:10px 0 16px; color:#334155; }
.code-row {
  display:grid; grid-template-columns:100px 1fr; gap:8px; align-items:start; margin:8px 0;
}
.label { color:var(--muted); font-size:13px; padding-top:8px; }
code, pre { font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace; }
.codebox {
  background:var(--code); color:#f8fafc; padding:10px 12px; border-radius:9px;
  overflow:auto; white-space:pre-wrap; word-break:break-word; font-size:13px;
}
.note {
  margin:16px 0; padding:12px 14px; background:var(--warn-bg); color:var(--warn);
  border-radius:10px; border:1px solid #f1d59d;
}
h3 { margin-top:26px; margin-bottom:10px; font-size:18px; }
.table-wrap { overflow:auto; border:1px solid var(--line); border-radius:12px; }
table { width:100%; border-collapse:collapse; min-width:720px; }
th, td { padding:11px 12px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
th { background:#f8fafc; font-size:13px; color:#475569; position:sticky; top:0; }
tr:last-child td { border-bottom:0; }
.opt { font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-weight:700; color:#1d4ed8; }
.default { color:#64748b; font-family:ui-monospace,SFMono-Regular,Consolas,monospace; }
.empty { padding:18px; color:var(--muted); text-align:center; border:1px dashed var(--line); border-radius:10px; }
.source { margin-top:22px; font-size:13px; color:var(--muted); }
.source a { color:var(--accent); text-decoration:none; }
.legend {
  max-width:1200px; margin:0 auto 14px; color:var(--muted); font-size:12px;
}
@media(max-width:700px) {
  header { padding:18px 14px 12px; position:static; }
  .tabs-wrap { position:static; }
  h1 { font-size:22px; }
  .card { padding:16px; }
  .code-row { grid-template-columns:1fr; }
  .label { padding-top:0; }
}
@media print {
  header,.tabs-wrap,.toolbar,.legend { display:none !important; }
  body { background:#fff; }
  main { padding:0; }
  .card { border:0; box-shadow:none; max-width:none; padding:0; }
  .source { display:none; }
}
</style>
</head>

 compose stats", "desc": "서비스 컨테이너의 CPU/메모리 등 실시간 리소스 사용량을 표시합니다.", "usage": "docker compose stats [OPTIONS] [SERVICE]", "example": "docker compose stats --no-stream", "options": [["-a, --all", "", "실행 중이 아닌 컨테이너까지 모두 표시합니다."], ["--format", "", "table/json/Go template 형식으로 출력합니다."], ["--no-stream", "", "계속 갱신하지 않고 한 번만 출력합니다."], ["--no-trunc", "", "출력을 생략하지 않습니다."]], "url": "https://docs.docker.com/reference/cli/docker/compose/stats/"}, {"name": "stop", "cmd": "docker compose stop", "desc": "실행 중인 서비스 컨테이너를 삭제하지 않고 중지합니다.", "usage": "docker compose stop [OPTIONS] [SERVICE...]", "example": "docker compose stop web", "important": true, "options": [["-t, --timeout", "", "정상 종료를 기다릴 시간을 초 단위로 지정합니다."]], "url": "https://docs.docker.com/reference/cli/docker/compose/stop/"}, {"name": "top", "cmd": "docker compose top", "desc": "서비스 컨테이너 안에서 실행 중인 프로세스를 표시합니다.", "usage": "docker compose top [SERVICES...]", "example": "docker compose top web", "options": [], "url": "https://docs.docker.com/reference/cli/docker/compose/top/"}, {"name": "unpause", "cmd": "docker compose unpause", "desc": "pause 상태인 서비스 컨테이너를 다시 실행 상태로 돌립니다.", "usage": "docker compose unpause [SERVICE...]", "example": "docker compose unpause web", "options": [], "url": "https://docs.docker.com/reference/cli/docker/compose/unpause/"}, {"name": "up", "cmd": "docker compose up", "desc": "이미지 빌드(필요 시), 컨테이너 생성/재생성, 시작, 로그 연결까지 수행하는 핵심 명령입니다.", "usage": "docker compose up [OPTIONS] [SERVICE...]", "example": "docker compose up -d --build", "important": true, "options": [["--abort-on-container-exit", "", "어떤 컨테이너든 멈추면 전체 컨테이너를 중지합니다. -d와 함께 사용할 수 없습니다."], ["--abort-on-container-failure", "", "어떤 컨테이너든 실패 종료하면 전체를 중지합니다. -d와 함께 사용할 수 없습니다."], ["--always-recreate-deps", "", "의존 컨테이너도 항상 다시 만듭니다."], ["--attach", "", "지정한 서비스에만 로그 attach합니다."], ["--attach-dependencies", "", "의존 서비스의 로그에도 자동 attach합니다."], ["--build", "", "시작 전에 이미지를 빌드합니다."], ["-d, --detach", "", "컨테이너를 백그라운드에서 실행합니다."], ["--exit-code-from", "", "선택한 서비스 컨  "cmd": "docker compose wait", "desc": "지정한 서비스 컨테이너가 종료될 때까지 명령 실행을 대기합니다.", "usage": "docker compose wait SERVICE [SERVICE...] [OPTIONS]", "example": "docker compose wait worker", "options": [["--down-project", "", "첫 번째 컨테이너가 종료되면 프로젝트를 down합니다."]], "url": "https://docs.docker.com/reference/cli/docker/compose/wait/"}, {"name": "watch", "cmd": "docker compose watch", "desc": "소스 변경을 감시하여 서비스 컨테이너를 rebuild/refresh합니다.", "usage": "docker compose watch [SERVICE...]", "example": "docker compose watch web", "options": [["--no-up", "", "watch 전에 build/start를 수행하지 않습니다."], ["--prune", "true", "rebuild 후 dangling image를 정리합니다."], ["--quiet", "", "빌드 출력을 숨깁니다."]], "url": "https://docs.docker.com/reference/cli/docker/compose/watch/"}];
const tabsEl = document.getElementById('tabs');
const panelEl = document.getElementById('panel');
const searchEl = document.getElementById('search');
const favBtn = document.getElementById('favBtn');

let active = 0;
let favoritesOnly = false;
let visibleIndexes = commands.map((_,i)=>i);

function esc(s) {
  return String(s ?? '')
    .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
    .replaceAll('"','&quot;').replaceAll("'",'&#039;');
}

function renderTabs() {
  tabsEl.innerHTML = '';
  visibleIndexes.forEach(i => {
    const c = commands[i];
    const b = document.createElement('button');
    b.className = 'tab' + (i === active ? ' active' : '');
    b.dataset.index = i;
    b.innerHTML = esc(c.name) + (c.important ? '<span class="star">★</span>' : '');
    b.onclick = () => {
      active = i;
      renderTabs();
      renderPanel();
      b.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
    };
    tabsEl.appendChild(b);
  });
}

function renderPanel() {
  const c = commands[active];
  const badges = [
    c.important ? '<span class="badge">자주 사용</span>' : '',
    c.experimental ? '<span class="badge exp">EXPERIMENTAL</span>' : ''
  ].join('');
  const rows = (c.options || []).map(o => `
    <tr>
      <td class="opt">${esc(o[0])}</td>
      <td class="default">${esc(o[1] || '—')}</td>
      <td>${esc(o[2])}</td>
    </tr>`).join('');

  panelEl.innerHTML = `
    <div class="command-title"><h2>${esc(c.cmd)}</h2>${badges}</div>
    <p class="desc">${esc(c.desc)}</p>
    <div class="code-row">
      <div class="label">사용법</div>
      <div class="codebox">${esc(c.usage)}</div>
    </div>
    <div class="code-row">
      <div class="label">예시</div>
      <div class="codebox">${esc(c.example)}</div>
    </div>
    ${c.note ? `<div class="note"><strong>주의/메모</strong><br>${esc(c.note)}</div>` : ''}
    <h3>옵션</h3>
    ${rows ? `
      <div class="table-wrap">
        <table>
          <thead><tr><th style="width:28%">옵션</th><th style="width:13%">기본값</th><th>설명</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>` : `<div class="empty">이 명령어 자체에는 별도 옵션이 없습니다.</div>`}
    <div class="source">공식 문서: <a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.url)}</a></div>
  `;
}

function applyFilter() {
  const q = searchEl.value.trim().toLowerCase();
  visibleIndexes = commands.map((_,i)=>i).filter(i => {
    const c = commands[i];
    const hit = !q || (c.name + ' ' + c.cmd + ' ' + c.desc).toLowerCase().includes(q);
    const fav = !favoritesOnly || c.important;
    return hit && fav;
  });
  if (!visibleIndexes.includes(active)) active = visibleIndexes[0] ?? 0;
  renderTabs();
  renderPanel();
}

searchEl.addEventListener('input', applyFilter);
favBtn.addEventListener('click', () => {
  favoritesOnly = !favoritesOnly;
  favBtn.classList.toggle('active', favoritesOnly);
  applyFilter();
});

renderTabs();
renderPanel();
</script>
