<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>CSS 공부 2단계</title>

    <style>

        body {
            background-color: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        h1 {
            color: blue;
        }

        h2 {
            color: green;
        }

        p {
            font-size: 18px;
        }

        button {
            background-color: black;
            color: white;
            padding: 10px 20px;
        }

    </style>

</head>

<body>

    <h1>CSS 공부하기</h1>

    <h2>2단계 : HTML 안에 CSS 사용하기</h2>

    <p>
        이번에는 HTML 문서 안에 CSS를 작성했습니다.
    </p>

    <button>버튼</button>

</body>

</html>
