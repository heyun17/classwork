<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>시스템 엔지니어 · MSP · 클라우드 이해도 평가</title>

<style>
:root{
  --ink:#1c1b19;
  --ink2:#37332f;
  --paper:#ffffff;
  --soft:#f7f6f3;
  --soft2:#efedea;
  --line:#e3e0db;
  --line2:#cfcbc4;
  --muted:#86827b;
  --accent:#b23c0a;
  --accent-soft:#fdf3ec;

  --green:#15803d;
  --green-soft:#f1f7f3;
  --green-line:#bcdcc8;

  --red:#b91c1c;
  --red-soft:#fdf2f2;
  --red-line:#f0c3c3;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
}

body{
  font-family:"Noto Sans KR","Malgun Gothic",sans-serif;
  background:#eceae5;
  color:var(--ink);
}

/* 한 문제가 한 화면을 차지 */
.quiz-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:28px 18px;
}

.quiz-wrap{
  width:min(920px,100%);
  min-height:650px;
  background:var(--paper);
  border:1px solid var(--line);
  box-shadow:0 2px 18px rgba(0,0,0,.07);
  display:flex;
  flex-direction:column;
  padding:32px 42px 26px;
}

/* 상단 */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid var(--line);
  padding-bottom:12px;
  margin-bottom:24px;
}

.brand{
  font-size:12px;
  color:var(--muted);
  font-weight:700;
  letter-spacing:.06em;
}

.progress-text{
  font-family:Consolas,monospace;
  font-size:12px;
  color:var(--ink2);
}

.progress{
  width:100%;
  height:6px;
  background:var(--soft2);
  margin-bottom:28px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  width:0%;
  background:var(--accent);
  transition:width .25s;
}

/* 난이도 */
.level{
  display:inline-block;
  width:max-content;
  padding:4px 11px;
  border-radius:20px;
  font-size:11px;
  font-weight:800;
  margin-bottom:13px;
  border:1px solid var(--line2);
}

.level-low{
  color:#1d4ed8;
  background:#f2f5fd;
  border-color:#c3d0f2;
}

.level-mid{
  color:var(--accent);
  background:var(--accent-soft);
  border-color:#e8c3ad;
}

.level-high{
  color:#6d28d9;
  background:#f7f3fe;
  border-color:#d4c6f5;
}

/* 문제 */
.question-no{
  font-size:11px;
  color:var(--accent);
  font-weight:800;
  letter-spacing:.12em;
  margin-bottom:8px;
}

.question{
  font-size:24px;
  font-weight:800;
  line-height:1.5;
  letter-spacing:-.02em;
  margin-bottom:24px;
}

/* 보기 */
.answers{
  display:grid;
  gap:10px;
}

.answer{
  width:100%;
  text-align:left;
  padding:15px 17px;
  border:1px solid var(--line2);
  background:#fff;
  font-size:14px;
  color:var(--ink2);
  cursor:pointer;
  transition:.15s;
  border-radius:4px;
}

.answer:hover{
  border-color:var(--accent);
  background:var(--accent-soft);
}

.answer.selected{
  border:2px solid var(--accent);
  padding:14px 16px;
  background:var(--accent-soft);
}

.answer.correct{
  border:2px solid var(--green);
  background:var(--green-soft);
  color:var(--green);
  font-weight:700;
}

.answer.wrong{
  border:2px solid var(--red);
  background:var(--red-soft);
  color:var(--red);
}

/* 버튼 */
.actions{
  display:flex;
  gap:9px;
  margin-top:20px;
}

button.control{
  border:1px solid var(--line2);
  background:#fff;
  color:var(--ink2);
  padding:10px 18px;
  border-radius:4px;
  font-weight:700;
  cursor:pointer;
}

button.control:hover{
  border-color:var(--accent);
}

button.primary{
  border-color:var(--accent);
  color:var(--accent);
  background:var(--accent-soft);
}

button:disabled{
  opacity:.35;
  cursor:not-allowed;
}

/* 결과 */
.feedback{
  margin-top:22px;
  display:none;
}

.result{
  padding:13px 16px;
  font-size:15px;
  font-weight:800;
  border-radius:4px 4px 0 0;
}

.result.correct{
  color:var(--green);
  background:var(--green-soft);
  border:1px solid var(--green-line);
}

.result.wrong{
  color:var(--red);
  background:var(--red-soft);
  border:1px solid var(--red-line);
}

.explanation{
  border:1px solid var(--line2);
  border-top:none;
  padding:16px 18px;
  background:var(--soft);
  line-height:1.75;
  font-size:13.5px;
  color:var(--ink2);
}

.explanation b{
  color:var(--accent);
}

/* 하단 */
.footer{
  margin-top:auto;
  padding-top:24px;
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:11px;
}

/* 시작 / 최종 결과 */
.center{
  text-align:center;
  margin:auto 0;
}

.center h1{
  font-size:32px;
  margin-bottom:12px;
}

.center p{
  line-height:1.8;
  color:var(--ink2);
}

.start-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  border:1px solid var(--line);
  margin:28px 0;
  gap:1px;
  background:var(--line);
}

.start-grid>div{
  background:#fff;
  padding:18px 12px;
}

.start-grid b{
  display:block;
  font-size:17px;
  margin-bottom:5px;
}

.big-score{
  font-family:Consolas,monospace;
  font-size:58px;
  font-weight:900;
  color:var(--accent);
  line-height:1;
  margin:20px 0 8px;
}

.score-table{
  width:100%;
  border-collapse:collapse;
  margin:28px 0;
}

.score-table th,
.score-table td{
  border-bottom:1px solid var(--line);
  padding:11px;
  text-align:left;
}

.score-table th{
  background:var(--soft);
}

.hidden{
  display:none;
}

@media(max-width:650px){
  .quiz-screen{
    padding:0;
    align-items:stretch;
  }

  .quiz-wrap{
    min-height:100vh;
    padding:23px 20px;
    box-shadow:none;
  }

  .question{
    font-size:20px;
  }

  .start-grid{
    grid-template-columns:1fr;
  }

  .actions{
    flex-wrap:wrap;
  }
}
</style>
</head>

<body>

<div class="quiz-screen">

<div class="quiz-wrap">

  <!-- 시작화면 -->
  <div id="startScreen" class="center">

    <div class="question-no">CLOUD · MSP · SYSTEM ENGINEERING</div>

    <h1>이해도 평가</h1>

    <p>
      시스템 엔지니어, 온프레미스와 클라우드,<br>
      MSP 실무와 클라우드 플랫폼에 대한 이해도를 확인합니다.
    </p>

    <div class="start-grid">

      <div>
        <span class="level level-low">난이도 하</span>
        <b>5문제</b>
        기본 개념 확인
      </div>

      <div>
        <span class="level level-mid">난이도 중</span>
        <b>5문제</b>
        개념 연결
      </div>

      <div>
        <span class="level level-high">난이도 상</span>
        <b>5문제</b>
        실무 상황 판단
      </div>

    </div>

    <button class="control primary"
            onclick="startQuiz()">
      평가 시작
    </button>

  </div>


  <!-- 문제화면 -->
  <div id="quizScreen" class="hidden">

    <div class="header">
      <div class="brand">SYSTEM · MSP · CLOUD</div>
      <div id="progressText"
           class="progress-text">
        01 / 15
      </div>
    </div>

    <div class="progress">
      <div id="progressBar"
           class="progress-bar"></div>
    </div>

    <div id="levelBadge"
         class="level">
    </div>

    <div id="questionNo"
         class="question-no">
    </div>

    <div id="question"
         class="question">
    </div>

    <div id="answers"
         class="answers">
    </div>

    <div class="actions">

      <button id="prevBtn"
              class="control"
              onclick="prevQuestion()">
        ← 이전
      </button>

      <button id="checkBtn"
              class="control primary"
              onclick="checkAnswer()">
        정답 확인
      </button>

      <button id="nextBtn"
              class="control"
              onclick="nextQuestion()"
              disabled>
        다음 →
      </button>

    </div>

    <div id="feedback"
         class="feedback">

      <div id="result"
           class="result">
      </div>

      <div id="explanation"
           class="explanation">
      </div>

    </div>

  </div>


  <!-- 최종 결과 -->
  <div id="resultScreen"
       class="center hidden">

    <div class="question-no">FINAL RESULT</div>

    <h1>평가 결과</h1>

    <div id="bigScore"
         class="big-score">
      0 / 15
    </div>

    <p id="gradeText"></p>

    <table class="score-table">
      <thead>
        <tr>
          <th>난이도</th>
          <th>정답</th>
          <th>문항</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>하</td>
          <td id="lowScore">0</td>
          <td>5</td>
        </tr>
        <tr>
          <td>중</td>
          <td id="midScore">0</td>
          <td>5</td>
        </tr>
        <tr>
          <td>상</td>
          <td id="highScore">0</td>
          <td>5</td>
        </tr>
      </tbody>
    </table>

    <button class="control primary"
            onclick="restartQuiz()">
      다시 풀기
    </button>

  </div>


  <div class="footer">
    <span>시스템 엔지니어 · MSP · 클라우드 입문</span>
    <span>이해도 평가 · 15문항</span>
  </div>

</div>

</div>


<script>

/* ===================================
   문제 데이터
=================================== */

const questions = [

/* ---------- 하 ---------- */

{
 level:"하",
 q:"온프레미스(On-Premises)의 설명으로 가장 알맞은 것은?",
 choices:[
   "AWS에서 필요한 만큼 서버를 빌려 사용하는 방식",
   "회사가 직접 서버와 장비를 보유하고 운영하는 방식",
   "웹브라우저만으로 프로그램을 사용하는 방식",
   "여러 클라우드 사업자를 동시에 사용하는 방식"
 ],
 answer:1,
 explanation:
 "<b>온프레미스</b>는 회사가 서버·스토리지·네트워크 장비 등을 직접 소유하고 구축·관리하는 방식입니다. AWS와 같은 외부 사업자에게 컴퓨팅 자원을 빌려 쓰는 것은 클라우드에 해당합니다."
},

{
 level:"하",
 q:"다음 중 대표적인 Public Cloud 플랫폼이 아닌 것은?",
 choices:[
   "AWS",
   "Microsoft Azure",
   "Google Cloud",
   "VMware ESXi"
 ],
 answer:3,
 explanation:
 "AWS, Azure, Google Cloud는 대표적인 <b>Public Cloud</b>입니다. VMware ESXi는 서버 가상화를 위한 하이퍼바이저 기술입니다."
},

{
 level:"하",
 q:"AWS에서 가상 서버를 생성할 때 대표적으로 사용하는 서비스는?",
 choices:[
   "EC2",
   "S3",
   "Route 53",
   "IAM"
 ],
 answer:0,
 explanation:
 "<b>EC2</b>는 AWS에서 가상 서버를 생성하고 사용하는 대표적인 컴퓨팅 서비스입니다. S3는 저장소, Route 53은 DNS, IAM은 사용자와 권한 관리에 사용합니다."
},

{
 level:"하",
 q:"MSP 엔지니어가 서버 장애를 확인할 때 가장 기본적으로 필요한 운영체제 기술은?",
 choices:[
   "Linux",
   "Photoshop",
   "Excel VBA만",
   "HTML 디자인"
 ],
 answer:0,
 explanation:
 "클라우드 서버의 상당수가 Linux 기반으로 운영되므로 <b>Linux 파일·권한·프로세스·서비스·로그·네트워크 확인 능력</b>은 MSP 엔지니어의 핵심 기초입니다."
},

{
 level:"하",
 q:"IaaS의 설명으로 가장 알맞은 것은?",
 choices:[
   "완성된 프로그램을 인터넷으로 사용하는 것",
   "서버·네트워크·스토리지 같은 인프라를 서비스로 제공받는 것",
   "종이 서버 매뉴얼을 제공하는 것",
   "프로그래밍 언어의 종류"
 ],
 answer:1,
 explanation:
 "<b>IaaS(Infrastructure as a Service)</b>는 VM, 네트워크, 스토리지 같은 인프라 자원을 서비스 형태로 제공합니다. AWS EC2, Azure VM, Google Compute Engine이 대표적인 예입니다."
},


/* ---------- 중 ---------- */

{
 level:"중",
 q:"AWS의 VPC를 이해하기 위해 가장 먼저 공부하면 좋은 분야는?",
 choices:[
   "그래픽 디자인",
   "TCP/IP와 서브넷 등 네트워크",
   "워드프로세서",
   "영상 편집"
 ],
 answer:1,
 explanation:
 "VPC, Subnet, Route Table, Internet Gateway, NAT Gateway, Security Group은 모두 기존 <b>네트워크 개념을 클라우드에서 구현한 것</b>입니다. 따라서 IP, CIDR, Subnet, Routing부터 이해하는 것이 좋습니다."
},

{
 level:"중",
 q:"회사 내부의 VMware 환경과 AWS를 연결하여 함께 운영하고 있다. 이 환경을 가장 잘 설명한 것은?",
 choices:[
   "SaaS",
   "Public Cloud",
   "Hybrid Cloud",
   "단일 서버"
 ],
 answer:2,
 explanation:
 "<b>Hybrid Cloud</b>는 회사 내부의 온프레미스·Private Cloud 환경과 Public Cloud를 연결하여 함께 사용하는 구조입니다."
},

{
 level:"중",
 q:"MSP 엔지니어 업무에서 모니터링 도구를 사용하는 가장 큰 이유는?",
 choices:[
   "서버 화면을 예쁘게 꾸미기 위해",
   "CPU·메모리·서비스 상태와 장애 징후를 지속적으로 확인하기 위해",
   "프로그래밍을 하지 않기 위해",
   "서버의 운영체제를 삭제하기 위해"
 ],
 answer:1,
 explanation:
 "MSP는 많은 고객 시스템을 운영합니다. 사람이 서버를 하나씩 확인할 수 없기 때문에 <b>CloudWatch, Prometheus, Grafana, Zabbix</b> 같은 도구를 이용하여 상태와 장애 징후를 관찰합니다."
},

{
 level:"중",
 q:"Terraform을 사용하는 주된 목적은?",
 choices:[
   "클라우드 인프라를 코드로 생성하고 관리하기 위해",
   "이미지를 편집하기 위해",
   "문서의 맞춤법을 검사하기 위해",
   "CPU를 직접 제조하기 위해"
 ],
 answer:0,
 explanation:
 "<b>Terraform</b>은 대표적인 IaC(Infrastructure as Code) 도구입니다. VPC, Subnet, EC2, Security Group 등의 인프라 구성을 코드로 정의하고 반복 생성할 수 있습니다."
},

{
 level:"중",
 q:"다음 연결 중 올바르지 않은 것은?",
 choices:[
   "AWS EKS → Kubernetes",
   "Azure AKS → Kubernetes",
   "Google GKE → Kubernetes",
   "AWS S3 → Kubernetes 클러스터"
 ],
 answer:3,
 explanation:
 "EKS, AKS, GKE는 각각 AWS·Azure·Google Cloud의 관리형 Kubernetes 서비스입니다. <b>S3</b>는 AWS의 객체 스토리지 서비스입니다."
},


/* ---------- 상 ---------- */

{
 level:"상",
 q:"AWS EC2의 웹서비스에 접속할 수 없다. 서버 프로세스는 정상 실행 중이다. 다음으로 확인할 항목으로 가장 적절한 것은?",
 choices:[
   "PowerPoint 테마",
   "포트·Security Group·Routing 등 네트워크 경로",
   "모니터 해상도",
   "키보드 언어"
 ],
 answer:1,
 explanation:
 "서비스 프로세스가 정상인데 외부 접속이 안 된다면 <b>Listening Port → Security Group → Subnet/Route Table → Gateway</b> 등의 네트워크 경로를 확인해야 합니다. 이것이 MSP에서 자주 하는 Troubleshooting 방식입니다."
},

{
 level:"상",
 q:"한 회사가 AWS, Azure, GCP를 각각 다른 업무에 사용하고 있다. 이 구조는?",
 choices:[
   "Multi-Cloud",
   "단일 On-Premises",
   "SaaS 전용 환경",
   "Localhost"
 ],
 answer:0,
 explanation:
 "<b>Multi-Cloud</b>는 둘 이상의 Public Cloud 사업자를 함께 사용하는 방식입니다. 예를 들어 웹서비스는 AWS, Microsoft 기반 시스템은 Azure, 데이터·AI 시스템은 GCP를 사용할 수 있습니다."
},

{
 level:"상",
 q:"MSP 엔지니어가 장애 발생 후 작성하는 보고서에 가장 적절한 내용 조합은?",
 choices:[
   "장애 원인·영향 범위·조치 내용·현재 상태·재발 방지",
   "직원의 취미·생일·점심 메뉴",
   "서버 제조사의 광고 문구",
   "소스코드 전체를 설명 없이 복사"
 ],
 answer:0,
 explanation:
 "MSP는 고객 시스템을 대신 운영하므로 기술적인 복구뿐 아니라 <b>장애 원인, 영향 범위, 조치, 복구 상태, 재발 방지</b>를 정확히 고객에게 전달하는 능력이 중요합니다."
},

{
 level:"상",
 q:"다음 중 클라우드/MSP 엔지니어 학습 순서로 가장 자연스러운 것은?",
 choices:[
   "Kubernetes → Linux → 네트워크 → AWS",
   "AWS 서비스 암기 → Linux 생략 → Kubernetes",
   "Linux → 네트워크 → AWS → Docker/Terraform → Kubernetes",
   "HTML → Photoshop → Kubernetes → Linux"
 ],
 answer:2,
 explanation:

/* ===================================
   상태
=================================== */

let current = 0;
let selected = null;

let states =
  questions.map(() => ({
    selected:null,
    checked:false,
    correct:false
  }));


/* ===================================
   시작
=================================== */

function startQuiz(){

  document.getElementById("startScreen")
          .classList.add("hidden");

  document.getElementById("quizScreen")
          .classList.remove("hidden");

  renderQuestion();

}


/* ===================================
   문제 표시
=================================== */

function renderQuestion(){

  const q = questions[current];
  const state = states[current];

  selected = state.selected;

  document.getElementById("progressText")
    .textContent =
    String(current+1).padStart(2,"0")
    + " / "
    + questions.length;

  document.getElementById("progressBar")
    .style.width =
    ((current+1)/questions.length*100) + "%";


  const badge =
    document.getElementById("levelBadge");

  badge.textContent =
    "난이도 " + q.level;

  badge.className =
    "level " +
    (
      q.level==="하"
      ? "level-low"
      : q.level==="중"
      ? "level-mid"
      : "level-high"
    );


  document.getElementById("questionNo")
    .textContent =
    "QUESTION " +
    String(current+1).padStart(2,"0");


  document.getElementById("question")
    .textContent = q.q;


  const answers =
    document.getElementById("answers");

  answers.innerHTML = "";


  q.choices.forEach((choice,index)=>{

    const btn =
      document.createElement("button");

    btn.className="answer";

    btn.innerHTML =
      "<b>" +
      String.fromCharCode(9312+index) +
      "</b>&nbsp;&nbsp;" +
      choice;


    if(state.checked){

      if(index===q.answer)
        btn.classList.add("correct");

      if(index===state.selected &&
         index!==q.answer)
        btn.classList.add("wrong");

    }
    else if(index===state.selected){

      btn.classList.add("selected");

    }


    btn.onclick=()=>{

      if(state.checked)
        return;

      states[current].selected=index;

      renderQuestion();

    };

    answers.appendChild(btn);

  });


  document.getElementById("prevBtn")
    .disabled = current===0;


  document.getElementById("checkBtn")
    .disabled =
    state.selected===null ||
    state.checked;


  document.getElementById("nextBtn")
    .disabled = !state.checked;


  const feedback =
    document.getElementById("feedback");


  if(state.checked){

    feedback.style.display="block";

    const result =
      document.getElementById("result");

    if(state.correct){

      result.className="result correct";
      result.textContent="✓ 정답입니다.";

    }
    else{

      result.className="result wrong";
      result.textContent="✕ 오답입니다.";

    }


    document.getElementById("explanation")
      .innerHTML =
      "<b>해설</b><br>" +
      q.explanation;

  }
  else{

    feedback.style.display="none";

  }


  if(current===questions.length-1){

    document.getElementById("nextBtn")
      .textContent="결과 보기";

  }
  else{

    document.getElementById("nextBtn")
      .textContent="다음 →";

  }

}


/* ===================================
   정답 확인
=================================== */

function checkAnswer(){

  const state=states[current];

  if(state.selected===null)
    return;

  state.checked=true;

  state.correct =
    state.selected===
    questions[current].answer;

  renderQuestion();

}


/* ===================================
   이동
=================================== */

function nextQuestion(){

  if(!states[current].checked)
    return;

  if(current === questions.length-1){

    showResults();
    return;

  }

  current++;

  renderQuestion();

  window.scrollTo(0,0);

}


function prevQuestion(){

  if(current===0)
    return;

  current--;

  renderQuestion();

  window.scrollTo(0,0);

}


/* ===================================
   결과
=================================== */

function showResults(){

  document.getElementById("quizScreen")
    .classList.add("hidden");

  document.getElementById("resultScreen")
    .classList.remove("hidden");


  let total=0;
  let low=0;
  let mid=0;
  let high=0;


  states.forEach((state,index)=>{

    if(!state.correct)
      return;

    total++;

    if(questions[index].level==="하")
      low++;

    if(questions[index].level==="중")
      mid++;

    if(questions[index].level==="상")
      high++;

  });


  document.getElementById("bigScore")
    .textContent =
    total+" / "+questions.length;

  document.getElementById("lowScore")
    .textContent=low;

  document.getElementById("midScore")
    .textContent=mid;

  document.getElementById("highScore")
    .textContent=high;


  let grade="";

  if(total>=13)
    grade=
    "기본 개념뿐 아니라 실무 상황까지 잘 이해하고 있습니다.";

  else if(total>=10)
    grade=
    "전체적인 구조는 잘 이해하고 있습니다. 틀린 문제의 해설을 다시 확인해 보세요.";

  else if(total>=7)
    grade=
    "기초 개념은 잡혀 있습니다. Linux·네트워크·클라우드의 연결 관계를 다시 복습해 보세요.";

  else
    grade=
    "기초 개념부터 다시 살펴보는 것이 좋습니다. 온프레미스·클라우드·Linux·네트워크부터 차근차근 복습해 보세요.";


  document.getElementById("gradeText")
    .textContent=grade;

}


/* ===================================
   다시 풀기
=================================== */

function restartQuiz(){

  current=0;
  selected=null;

  states =
    questions.map(()=>({
      selected:null,
      checked:false,
      correct:false
    }));

  document.getElementById("resultScreen")
    .classList.add("hidden");

  document.getElementById("quizScreen")
    .classList.remove("hidden");

  renderQuestion();

}

</script>
