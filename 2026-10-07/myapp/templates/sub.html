<!DOCTYPE html>
<html>
<head>

    <title>상품 목록</title>
</head>

    <h1>상품 목록</h1>

    <ul>
        {% for product in products %}

        {% endfor %}

    <a href="/">메인으로</a>

</body>
</html>
