apiVersion: v1
kind: Service
metadata:
  name: web-svc
spec:
  type: NodePort              # 노드의 포트로 밖에 연다
  selector:
    app: web                  # 이 라벨을 가진 파드들에게 나눠 보낸다
  ports:
    - port: 80                # 서비스 자신의 포트
      targetPort: 80          # 파드 안의 포트
      nodePort: 30080         # 노드에서 열 포트 (30000~32767)
